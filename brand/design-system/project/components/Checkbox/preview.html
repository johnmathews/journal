<!-- @dsCard group="Forms" height=180 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 16px; background: var(--panel); color: var(--ink); font-family: var(--font-sans); }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .list label { display: flex; align-items: center; gap: 12px; font: 400 14px/22px var(--font-sans); color: var(--ink); cursor: pointer; }
  .list .kind { color: var(--ink-secondary); }
  /* .form-checkbox from webapp/src/assets/utility-patterns.css, with the 2026-11-27 control-border. */
  .cb { appearance: none; margin: 0; width: 16px; height: 16px; flex: none; border: 1px solid var(--control-border); border-radius: var(--radius-sm);
        background: var(--panel) center / 100% 100% no-repeat; cursor: pointer; }
  [data-theme="dark"] .cb { background-color: color-mix(in srgb, var(--canvas) 30%, var(--panel)); }
  .cb:checked { background-color: var(--accent); border-color: transparent;
                background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e"); }
  .cb:focus-visible, .cb.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .head { margin: 0 0 12px; color: var(--ink-secondary); }
</style>
</head>
<body>
<p class="caption head">2 selected</p>
<ul class="list">
  <li><label><input class="cb" type="checkbox" checked> Lisbon <span class="kind caption">place</span></label></li>
  <li><label><input class="cb" type="checkbox" checked> Anna <span class="kind caption">person</span></label></li>
  <li><label><input class="cb is-focus" type="checkbox"> Running <span class="kind caption">activity</span></label></li>
  <li><label><input class="cb" type="checkbox"> Book club <span class="kind caption">organisation</span></label></li>
</ul>
</body>
</html>
