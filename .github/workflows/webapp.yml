name: Webapp CI and Deploy

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "contract/**"
      - ".github/workflows/webapp.yml"
      # Prose never reaches the image or the tests. Without these, a docs edit
      # rebuilds :latest and WUD redeploys prod for nothing.
      - "!webapp/docs/**"
      - "!webapp/journal/**"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - "contract/**"
      - ".github/workflows/webapp.yml"
      # Prose never reaches the image or the tests. Without these, a docs edit
      # rebuilds :latest and WUD redeploys prod for nothing.
      - "!webapp/docs/**"
      - "!webapp/journal/**"
      - "!**/*.md"
  workflow_dispatch:

# Every `run:` step executes inside webapp/. Action inputs (cache path,
# artifact path, Docker context) are workspace-relative and set explicitly.
defaults:
  run:
    working-directory: webapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: webapp/.nvmrc
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: webapp/coverage/
          retention-days: 14

  docker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: webapp
          push: true
          tags: |
            ghcr.io/johnmathews/journal-webapp:latest
            ghcr.io/johnmathews/journal-webapp:${{ github.sha }}
